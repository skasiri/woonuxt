query getPostCategoryByUri($uri: ID!, $first: Int = 10, $after: String) {
  category(id: $uri, idType: URI) {
    databaseId
    id
    name
    slug
    description
    uri
    posts(first: $first, after: $after, where: { status: PUBLISH }) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        databaseId
        title
        slug
        excerpt
        date
        featuredImage {
          node {
            sourceUrl
            altText
          }
        }
        author {
          node {
            name
            slug
          }
        }
      }
    }
  }
}
